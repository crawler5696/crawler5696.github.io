name: update-news

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect news
        run: python scripts/collect_news.py --out data/news.json

      - name: Commit and push if changed
        run: |
          git config user.name "news-radar-bot"
          git config user.email "news-radar-bot@users.noreply.github.com"
          git add data/news.json
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "chore: 뉴스 갱신 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
