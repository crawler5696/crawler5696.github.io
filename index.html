<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뉴스레이더 · 실시간 속보 / 오늘 상한가 / 테마달력</title>
<meta property="description" content="네이버 금융 실시간 속보·이슈 순위에 더해, 오늘 상한가 종목과 그 이유 요약, 최근 12개월 상한가 테마 달력까지 한 화면에 보여주는 무료 증시 뉴스 대시보드">
<meta property="og:type" content="website">
<meta property="og:site_name" content="뉴스레이더">
<meta property="og:title" content="뉴스레이더 · 실시간 속보 + 오늘 상한가 + 테마달력">
<meta property="og:description" content="실시간 속보·이슈 순위, 오늘 상한가 종목과 이슈 요약, 최근 12개월 상한가 테마 달력">
<meta property="og:url" content="https://crawler5696.github.io/">
<meta property="og:image" content="https://crawler5696.github.io/icons/icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0b1120">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="뉴스레이더">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#0b1120; --bg2:#0e1730; --card:#141d33; --card2:#18233d;
    --line:rgba(255,255,255,.08); --txt:#eef2fa; --dim:#8f9bb3; --dim2:#6b778f;
    --accent:#4f8cff; --up:#ff5a6e; --ok:#3ddc97;
    --radius:11px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 50% -200px, rgba(79,140,255,.20), transparent 70%),
      linear-gradient(180deg,var(--bg) 0%, var(--bg2) 100%);
    background-attachment:fixed;
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Roboto,sans-serif;
    font-size:14px;line-height:1.45;
    -webkit-font-smoothing:antialiased;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:640px;margin:0 auto;padding:0 9px}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:20;
    backdrop-filter:saturate(160%) blur(14px);
    -webkit-backdrop-filter:saturate(160%) blur(14px);
    background:linear-gradient(180deg, rgba(11,17,32,.95), rgba(11,17,32,.84));
    border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);
  }
  .top{display:flex;align-items:center;gap:8px;padding:6px 0 4px}
  .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#4f8cff,#8b5cf6);
    display:grid;place-items:center;font-size:14px;box-shadow:0 4px 12px rgba(79,140,255,.38);flex:none}
  .brand{font-size:15px;font-weight:800;letter-spacing:-.4px;white-space:nowrap;line-height:1.15}
  .brand small{display:block;font-size:9.5px;font-weight:600;color:var(--dim2);letter-spacing:0}
  @media (max-width:430px){ .brand small{display:none} .brand{font-size:14.5px} }
  .spacer{flex:1}
  .live{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--ok);
    background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.25);
    padding:3px 7px;border-radius:20px;white-space:nowrap}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(61,220,151,.5)}50%{opacity:.5;box-shadow:0 0 0 4px rgba(61,220,151,0)}}
  .refresh{width:29px;height:29px;border-radius:9px;border:1px solid var(--line);background:var(--card);
    color:var(--dim);display:grid;place-items:center;font-size:14px;flex:none;cursor:pointer;transition:.2s}
  .refresh:active{transform:scale(.92);background:var(--card2)}
  .refresh.spinning{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- 탭 (비밀 모드에서만 핫바가 더 붙는다) ---------- */
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:0 0 6px}
  .tab{
    appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.03);
    color:var(--dim);font-family:inherit;font-size:12px;font-weight:700;letter-spacing:-.3px;
    padding:6px 2px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:.15s;
    display:flex;align-items:center;justify-content:center;gap:2px;
  }
  .tab:active{transform:scale(.97)}
  .tab[aria-selected="true"]{
    color:#fff;border-color:transparent;background:linear-gradient(135deg,#4f8cff,#7c5cff);
    box-shadow:0 3px 12px rgba(79,140,255,.32);
  }
  /* 레이더 — 글씨는 다른 탭과 같게 두고, 옆의 작은 빨간 등이 켜진다 */
  .rdot{width:6px;height:6px;border-radius:50%;flex:none;background:#46506a;
    transition:background .25s ease;box-shadow:none}
  .rdot.on{background:#ff3b4e;animation:rdpulse 1.8s ease-out infinite}
  .rdot.hot{background:#ff2d44;box-shadow:0 0 6px rgba(255,45,68,.85);animation:rdpulse 1s ease-out infinite}
  .rdot.big{width:7px;height:7px;margin-left:1px}
  @keyframes rdpulse{
    0%{box-shadow:0 0 0 0 rgba(255,59,78,.7)}
    70%{box-shadow:0 0 0 5px rgba(255,59,78,0)}
    100%{box-shadow:0 0 0 0 rgba(255,59,78,0)}
  }
  @media (prefers-reduced-motion:reduce){
    .rdot.on,.rdot.hot{animation:none;box-shadow:0 0 5px rgba(255,45,68,.8)}
  }
  @media (max-width:410px){ .tab{font-size:11.2px;padding:6px 1px;gap:1px;letter-spacing:-.4px} }

  /* ---------- controls ---------- */
  .meta{display:flex;flex-wrap:wrap;row-gap:2px;align-items:center;gap:6px;font-size:11.5px;color:var(--dim2);padding:5px 1px 4px}
  .meta b{color:var(--dim);font-weight:600}
  /* 비밀 방문자 수 배지 — 관리자가 켰을 때만 보인다 */
  .vbadge{display:inline-flex;align-items:center;gap:3px;margin-left:auto;flex:none;white-space:nowrap;
    font-size:10.5px;font-weight:600;color:var(--dim2);text-decoration:none;
    border:1px solid var(--line);background:rgba(255,255,255,.02);
    padding:1px 6px;border-radius:20px;transition:color .15s,border-color .15s}
  .vbadge:hover{color:var(--dim);border-color:rgba(79,140,255,.45)}
  .vbadge span{color:var(--dim);font-weight:700}
  .vbadge[hidden]{display:none}
  /* 호재·혼조·악재 전광판 — 헤더의 '뉴스레이더' 제목 바로 옆에 🇰🇷 · 🇺🇸 두 개 */
  .mood{display:inline-flex;align-items:center;gap:3px;flex:none;white-space:nowrap;
    font-size:10.5px;font-weight:700;letter-spacing:-.2px;
    border:1px solid var(--line);background:rgba(255,255,255,.03);
    padding:1px 6px 1px 4px;border-radius:20px;transition:color .2s,border-color .2s}
  .mood[hidden]{display:none}
  .mood .flag{font-size:11px;line-height:1;font-weight:400;letter-spacing:0}
  .mood.good{color:#ff6b7a;border-color:rgba(255,107,122,.75);background:rgba(127,29,29,.5)}
  .mood.mid{color:#ffe066;border-color:rgba(255,224,102,.75);background:rgba(133,77,14,.48)}
  .mood.bad{color:#66b2ff;border-color:rgba(102,178,255,.75);background:rgba(30,58,138,.5)}
  /* 좌은 폰 폭에서는 헤더 간격까지 좀혀 한 줄을 지는다 */
  @media (max-width:430px){ .top{gap:6px} }
  @media (max-width:380px){ .vbadge{font-size:10px;padding:1px 5px;gap:2px}
    .mood{font-size:10px;padding:1px 5px 1px 3px;gap:2px}
    .mood .flag{font-size:10px}
    .brand{font-size:14px} }


  /* ---------- 구역 머리 ---------- */
  main{padding-top:1px}
  .sechead{display:flex;align-items:center;gap:5px;margin:6px 1px 4px;font-size:13px;font-weight:800;letter-spacing:-.2px}
  .sechead .bar{width:3px;height:12px;border-radius:2px;background:#ff5a6e}
  .sechead.issue .bar{background:linear-gradient(180deg,#4f8cff,#7c5cff)}
  .sechead .livechip{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:800;color:#ff8b9c;
    background:rgba(255,90,110,.12);border:1px solid rgba(255,90,110,.3);padding:1px 6px;border-radius:6px;margin-left:auto}

  /* ---------- 속보 초슬림 카드 ---------- */
  .fcard{
    display:block;background:var(--card);border:1px solid var(--line);border-left:3px solid #ff5a6e;
    border-radius:10px;padding:7px 10px 6px;margin-bottom:6px;transition:background .15s;
  }
  .fcard:active{background:var(--card2)}
  .frow{display:flex;gap:5px;align-items:baseline}
  .fb{flex:none;font-size:10px;font-weight:800;color:#ff8b9c;background:rgba(255,90,110,.13);
    border:1px solid rgba(255,90,110,.3);padding:1px 5px;border-radius:5px;letter-spacing:-.2px;position:relative;top:-1px}
  .fb.live{color:#7fd3e8;background:rgba(127,211,232,.12);border-color:rgba(127,211,232,.3)}
  .fb.old{color:var(--dim2);background:rgba(255,255,255,.04);border-color:var(--line)}
  .ft{font-size:14px;font-weight:600;line-height:1.32;letter-spacing:-.3px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .fmeta{display:flex;align-items:center;gap:5px;margin-top:2px;padding-left:1px}
  .lead{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#9fc0ff;
    background:rgba(79,140,255,.09);border:1px solid rgba(79,140,255,.24);padding:1px 6px;border-radius:5px;
    max-width:75%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .lead b{font-weight:800;color:#7fa8ff;font-size:10px}
  .src{margin-left:auto;font-size:11px;color:var(--dim2);white-space:nowrap;font-weight:600}
  .src .p{color:var(--dim)}

  /* ---------- 이슈 슬림 카드 ---------- */
  .icard{
    background:var(--card);border:1px solid var(--line);border-left:3px solid var(--c,#4f8cff);
    border-radius:10px;padding:7px 10px 6px;margin-bottom:6px;position:relative;
  }
  .irow{display:flex;gap:6px;align-items:flex-start}
  .rankb{flex:none;min-width:19px;height:19px;border-radius:6px;display:grid;place-items:center;
    font-size:11px;font-weight:800;color:var(--dim);background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.14);margin-top:2px}
  .rankb.top3{color:#fff;background:linear-gradient(135deg,#4f8cff,#7c5cff);border-color:transparent}
  .ititle{flex:1;font-size:14px;font-weight:600;line-height:1.32;letter-spacing:-.3px;color:var(--txt);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .isum{font-size:11.5px;color:#93a1ba;line-height:1.45;margin:0 0 4px;
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .ifoot{display:flex;align-items:center;gap:5px;margin:3px 0 0 0;font-size:11px;color:var(--dim2);min-height:16px}
  .ifoot .lead{font-size:10.5px;padding:0 5px}
  .presses{font-size:10.5px;font-weight:800;color:#9fc0ff;background:rgba(79,140,255,.12);
    border:1px solid rgba(79,140,255,.3);padding:0 6px;border-radius:20px;white-space:nowrap;
    font-family:inherit;cursor:pointer;height:17px;line-height:15px}
  .brk{font-size:10px;font-weight:800;color:#fff;padding:0 5px;border-radius:5px;
    background:linear-gradient(135deg,#ff4d4d,#ff8a4c);white-space:nowrap;height:17px;line-height:17px}
  .exp{margin-left:auto;appearance:none;border:0;background:transparent;color:#5f6f8c;
    font-size:13px;padding:0 2px;cursor:pointer;font-family:inherit;line-height:1}
  .idet{display:none;margin:5px 0 0 0;padding-left:25px}
  .icard.open .idet{display:block}
  .relm{display:block;margin:3px 0 0}
  .relm a{display:block;font-size:12px;color:#a9b7cd;padding:4px 0 4px 7px;border-top:1px solid var(--line);line-height:1.4}
  .relm a .rp{color:#6b778f;font-size:9.5px}
  .more{width:100%;appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.03);
    color:var(--dim);font-family:inherit;font-size:12px;font-weight:700;padding:8px;border-radius:9px;
    margin-top:2px;cursor:pointer}
  .more:active{background:var(--card2)}
  .mini-empty{font-size:11px;color:var(--dim2);padding:10px 4px}

  /* ---------- 공통 ---------- */
  .viewhead{display:flex;align-items:baseline;gap:7px;padding:10px 2px 7px}
  .viewhead b{font-size:14px;letter-spacing:-.2px}
  .viewhead span{font-size:11px;color:var(--dim2)}

  /* ---------- 오늘 상한가 ---------- */
  .upper-bar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:0 1px 7px}
  .badge-d{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:800;
    color:#ffd166;background:rgba(255,209,102,.12);border:1px solid rgba(255,209,102,.32);
    padding:2px 7px;border-radius:7px;white-space:nowrap}
  .badge-d.prev{color:#ffb27a;background:rgba(255,138,76,.13);border-color:rgba(255,138,76,.34)}
  .badge-d.cnt{color:#9fc0ff;background:rgba(79,140,255,.12);border-color:rgba(79,140,255,.32)}
  .up-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:11px;
    padding:8px 9px 7px 12px;margin-bottom:6px;overflow:hidden}
  .up-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,#ff5a6e,#ffb27a)}
  .up-top{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .up-no{flex:none;font-size:10px;font-weight:800;color:#7c8ba6;min-width:13px}
  .up-name{font-size:14px;font-weight:800;letter-spacing:-.3px;color:#fff;line-height:1.2}
  .up-mk{font-size:9.5px;font-weight:700;color:var(--dim);background:rgba(255,255,255,.06);
    border:1px solid var(--line);padding:1px 5px;border-radius:5px;white-space:nowrap}
  .up-price{margin-left:auto;font-size:13.5px;font-weight:800;color:#ff7285;white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .up-rate{font-size:10.5px;font-weight:800;color:#fff;background:rgba(255,90,110,.2);
    border:1px solid rgba(255,90,110,.38);padding:1px 5px;border-radius:5px;white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .up-tags{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:4px}
  .up-theme{font-size:10px;font-weight:800;color:#c9a2ff;background:rgba(201,162,255,.13);
    border:1px solid rgba(201,162,255,.32);padding:1px 6px;border-radius:5px;white-space:nowrap}
  .up-val{font-size:10px;color:var(--dim)}
  .up-sum{font-size:11.8px;color:#c8d2e4;line-height:1.5;margin:5px 0 0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .up-card.open .up-sum{-webkit-line-clamp:unset;display:block}
  .up-card .u-full{display:none;margin-top:5px;padding-top:5px;border-top:1px dashed var(--line)}
  .up-card.open .u-full{display:block}
  .u-full a{display:block;font-size:11px;color:#a9b7cd;line-height:1.4;text-decoration:none}
  .up-src{display:flex;align-items:center;gap:4px;margin-top:6px;padding-top:5px;
    border-top:1px solid var(--line);font-size:10.5px;color:var(--dim2)}
  .up-src .p{color:var(--dim);font-weight:700}
  .up-src a{margin-left:auto;color:#9fc0ff;font-weight:800;text-decoration:none;white-space:nowrap;
    padding-left:6px}
  .up-more{appearance:none;border:0;background:transparent;color:#7c8ba6;font-family:inherit;
    font-size:10px;font-weight:800;padding:0 0 0 4px;cursor:pointer;white-space:nowrap}

  /* ---------- 테마달력 ---------- */
  .mon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:1px 0 9px}
  .mon{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--dim);
    font-family:inherit;border-radius:9px;padding:5px 0 4px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:1px;transition:.15s}
  .mon .m{font-size:11px;font-weight:800;letter-spacing:-.3px;line-height:1.1}
  .mon .n{font-size:9px;font-weight:700;color:var(--dim2)}
  .mon:active{transform:scale(.96)}
  .mon[aria-pressed="true"]{color:#fff;border-color:transparent;
    background:linear-gradient(135deg,#4f8cff,#7c5cff);box-shadow:0 3px 12px rgba(79,140,255,.3)}
  .mon[aria-pressed="true"] .n{color:rgba(255,255,255,.85)}
  @media (max-width:360px){ .mon-grid{gap:3px} .mon .m{font-size:10.5px} .mon .n{font-size:8.5px} }

  .cal-head{display:flex;align-items:center;gap:6px;margin:0 1px 5px}
  .cal-head b{font-size:13px;font-weight:800;letter-spacing:-.2px}
  .cal-head span{font-size:10.5px;color:var(--dim2)}
  .cal-head .cal-all{margin-left:auto;font-size:10px;font-weight:700;color:#7c8ba6;
    border:1px solid var(--line);background:rgba(255,255,255,.03);padding:2px 6px;border-radius:6px;
    cursor:pointer;font-family:inherit}
  .th-card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:5px;overflow:hidden}
  .th-head{width:100%;appearance:none;border:0;background:transparent;color:inherit;font-family:inherit;
    display:flex;align-items:center;gap:6px;padding:8px 9px;text-align:left;cursor:pointer}
  .th-head:active{opacity:.8}
  .th-name{flex:1;font-size:12.5px;font-weight:700;letter-spacing:-.2px;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .th-cnt{flex:none;font-size:9.5px;font-weight:800;color:#9fc0ff;background:rgba(79,140,255,.12);
    border:1px solid rgba(79,140,255,.28);padding:1px 5px;border-radius:5px}
  .th-exp{flex:none;font-size:10px;color:#5f6f8c;transition:transform .15s}
  .th-card.open .th-exp{transform:rotate(180deg)}
  .th-body{display:none;padding:0 9px 8px;border-top:1px solid var(--line)}
  .th-card.open .th-body{display:block}
  .th-sum{font-size:11.5px;color:#b9c6da;line-height:1.55;margin:7px 0 7px;letter-spacing:-.1px}
  .stk-grid{display:flex;flex-wrap:wrap;gap:4px}
  .stk{display:inline-flex;align-items:baseline;gap:4px;background:rgba(255,255,255,.04);
    border:1px solid var(--line);border-radius:7px;padding:3px 6px}
  .stk b{font-size:11px;font-weight:700;color:#e8eefc}
  .stk i{font-style:normal;font-size:9.5px;color:#ff9aa8;font-weight:700;white-space:nowrap}

  /* ---------- 레이더 ---------- */
  .rd-card{position:relative;background:var(--card);border:1px solid var(--line);
    border-radius:11px;padding:9px 10px 8px 13px;margin-bottom:7px;overflow:hidden}
  .rd-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,#4f8cff)}
  .rd-top{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .rd-rank{flex:none;font-size:10px;font-weight:800;color:#fff;background:var(--c,#4f8cff);
    padding:1px 6px;border-radius:5px;letter-spacing:-.2px}
  .rd-theme{font-size:13.5px;font-weight:800;letter-spacing:-.3px;line-height:1.25}
  .rd-cnt{margin-left:auto;font-size:10px;font-weight:700;color:var(--dim);
    background:rgba(255,255,255,.05);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
  .rd-why{font-size:11.5px;color:#c2cde0;line-height:1.5;margin:5px 0 7px;letter-spacing:-.1px}
  .rd-stks{display:flex;flex-direction:column;gap:4px}
  .rd-stk{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.035);
    border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-width:0}
  .rd-stk b{font-size:12.5px;font-weight:700;color:#eef2fa;letter-spacing:-.2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rd-stk .px{font-size:10.5px;color:var(--dim2);font-weight:600;white-space:nowrap;flex:none}
  .rd-stk .drp{margin-left:auto;flex:none;min-width:27px;text-align:center;font-size:11.5px;font-weight:800;
    color:#fff;background:rgba(255,90,110,.2);border:1px solid rgba(255,90,110,.45);
    border-radius:6px;padding:1px 5px;font-variant-numeric:tabular-nums}
  .rd-warn{font-size:10.5px;color:#ffb27a;margin:6px 0 0}
  .rd-dot{width:7px;height:7px;border-radius:50%;flex:none}
  .rd-dot.on{background:#ff2d44;box-shadow:0 0 6px rgba(255,45,68,.9);animation:rdpulse 1s ease-out infinite}
  .rd-dot.off{background:transparent;border:1.5px solid #4a5570}
  .rd-hit{flex:none;font-size:9.5px;font-weight:800;color:#ff8b9c;
    background:rgba(255,90,110,.13);border:1px solid rgba(255,90,110,.34);
    padding:1px 5px;border-radius:5px;white-space:nowrap}
  .rd-wait{flex:none;font-size:9.5px;font-weight:800;color:#8f9bb3;
    background:rgba(255,255,255,.04);border:1px solid var(--line);
    padding:1px 5px;border-radius:5px;white-space:nowrap}

  /* ---------- 핫바 (비밀 모드에서만 보인다) ---------- */
  .tabs.five{grid-template-columns:repeat(5,1fr)}
  .tab[hidden]{display:none}
  @media (max-width:410px){ .tabs.five .tab{font-size:10.4px;letter-spacing:-.5px} }
  .hb-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:2px 0 6px}
  .hb-seg button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.03);
    color:var(--dim);font-family:inherit;font-size:12px;font-weight:800;letter-spacing:-.3px;
    padding:7px 2px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:.15s}
  .hb-seg button:active{transform:scale(.98)}
  .hb-seg button .s{display:block;font-size:9px;font-weight:600;color:var(--dim2);letter-spacing:0}
  .hb-seg button.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,#4f8cff,#7c5cff);
    box-shadow:0 3px 12px rgba(79,140,255,.3)}
  .hb-seg button.on .s{color:rgba(255,255,255,.78)}
  .hb-grp{margin-bottom:4px}
  .hb-head{display:flex;align-items:center;gap:6px;margin:9px 1px 5px}
  .hb-badge{width:21px;height:21px;border-radius:6px;display:grid;place-items:center;
    font-size:10.5px;font-weight:900;flex:none}
  .hb-badge.s1{background:rgba(79,140,255,.16);color:#9dbcff;border:1px solid rgba(79,140,255,.42)}
  .hb-badge.s2{background:rgba(255,179,71,.14);color:#ffc477;border:1px solid rgba(255,179,71,.4)}
  .hb-badge.s3{background:rgba(61,220,151,.14);color:#63e3ae;border:1px solid rgba(61,220,151,.4)}
  .hb-desc{font-size:11.5px;font-weight:700;color:var(--dim)}
  .hb-cnt{margin-left:auto;font-size:10px;font-weight:700;color:var(--dim2);
    background:rgba(255,255,255,.04);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
  .hb-row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    border-radius:9px;padding:6px 9px;margin-bottom:4px}
  .hb-row:active{background:var(--card2)}
  .hb-l{min-width:0;flex:1}
  .hb-name{font-size:13px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hb-note{font-size:9.5px;color:var(--dim2);letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hb-r{text-align:right;white-space:nowrap;flex:none}
  .hb-px{font-size:12.5px;font-weight:800;letter-spacing:-.2px}
  .hb-sub{font-size:10px;font-weight:700;color:var(--dim);display:flex;gap:5px;justify-content:flex-end}
  .hb-sub .up{color:var(--up)}
  .hb-sub .dn{color:#5a8cff}
  .hb-sub .dd{color:var(--dim2);font-weight:600}
  .hb-more{width:100%;margin:1px 0 4px;padding:6px;border-radius:8px;border:1px dashed var(--line);
    background:transparent;color:var(--dim2);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer}
  .hb-empty{font-size:10.5px;color:var(--dim2);padding:4px 3px 6px}
  /* 일정 배지 — 레이더 상단 바 · 카드 · 핫바 종목 */
  .rd-sched{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;margin:0 1px 7px;padding:4px 8px;
    font-size:10.5px;font-weight:700;color:#cfe0ff;line-height:1.45;
    background:rgba(79,140,255,.08);border:1px solid rgba(79,140,255,.22);border-radius:8px}
  .rd-sched b{color:#8fb2ff;font-weight:800}
  .rd-sched span{color:#5d6a86}
  .rd-evt{display:block;font-size:10px;font-weight:700;color:#9fc0ff;margin:3px 0 0;letter-spacing:-.2px}
  .hb-evt{display:inline-block;margin-left:5px;padding:0 4px;border-radius:5px;white-space:nowrap;
    font-size:9px;font-weight:800;color:#9fc0ff;background:rgba(79,140,255,.14);
    border:1px solid rgba(79,140,255,.32);vertical-align:1px}

  .empty{text-align:center;color:var(--dim2);padding:40px 16px;font-size:12px;line-height:1.7}
  .skeleton{height:56px;border-radius:10px;background:linear-gradient(90deg,#141d33,#1b2743,#141d33);
    background-size:200% 100%;animation:sk 1.4s infinite;margin-bottom:6px}
  @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

  #top{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));width:36px;height:36px;
    border-radius:50%;border:1px solid var(--line);background:rgba(20,29,51,.9);color:var(--dim);
    display:none;place-items:center;font-size:14px;backdrop-filter:blur(8px);cursor:pointer;z-index:15}
  #top.show{display:grid}
  /* 새로고침 결과 토스트 — 손가락 밑(맨 위로 버튼 위쪽)에 잠깐 떴다 사라진다 */
  .toast{position:fixed;left:50%;bottom:calc(58px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
    max-width:calc(100vw - 32px);padding:9px 14px;border-radius:12px;
    background:rgba(16,24,42,.97);border:1px solid var(--line);color:#e8eefc;
    font-size:12.5px;font-weight:700;letter-spacing:-.2px;line-height:1.35;text-align:center;
    box-shadow:0 8px 26px rgba(0,0,0,.48);backdrop-filter:blur(10px);
    opacity:0;pointer-events:none;z-index:30;transition:opacity .16s ease,transform .16s ease}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>
</head>
<body>

<main class="wrap">

    <div class="sechead"><span class="bar"></span>⚡ 실시간 속보

      <button class="cal-all" id="calAll" type="button">모두 펼치기</button>

<button id="top" aria-label="맨 위로">↑</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const state = { data:null, calendar:null, radar:null, month:null, tab:'news', more:false, open:new Set(), hotOpen:new Set() };
const TABS = ['news','upper','calendar','radar','hotbar'];
const FIRST_ISSUES = 14;   // 이슈 순위 첫 화면 14건 (속보 6건과 3:7)

const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function relTime(iso){
  if(!iso) return '';
  const d = new Date(iso), now = new Date();
  const m = Math.floor((now - d)/60000);
  if(isNaN(m)) return '';
  if(m < 1) return '방금';
  if(m < 60) return m + '분 전';
  const h = Math.floor(m/60);
  if(h < 24) return h + '시간 전';
  const days = Math.floor(h/24);
  if(days < 7) return days + '일 전';
  return (d.getMonth()+1) + '.' + d.getDate();
}
function hm(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function themesList(){ return (state.data && state.data.themes) || []; }
function flashAll(){ return (state.data && state.data.flash) || []; }
function issueAll(){ return (state.data && state.data.issues) || (state.data && state.data.articles) || []; }
function themeColor(id){
  const t = themesList().find(x => x.id === id);
  return (t && t.color) || '#8f9bb3';
}

/* 제목을 글자만 남겨 비교 — 속보와 이슈에 같은 사건이 두 번 보이지 않게 한다 */
function normTitle(t){
  return (t||'').replace(/\[[^\]]*\]|\([^)]*\)|[“”"'‘’·…,!?.\-~]/g,'').replace(/[^0-9A-Za-z가-힣]/g,'');
}
function sameStory(a, b){
  if(!a || !b) return false;
  if(a === b) return true;
  const k = Math.min(a.length, b.length, 16);
  return k >= 11 && a.slice(0, k) === b.slice(0, k);
}

function flashList(){
  return flashAll();
}

function issueList(){
  const flashNorms = flashAll().map(a => normTitle(a.title));
  /* 위 속보와 같은 사건을 다룬 이슈는 이슈 목록에서 뺀다 */
  return issueAll().filter(a => !flashNorms.some(f => sameStory(normTitle(a.title), f)));
}

/* ---------------- 탭 ---------------- */
function switchTab(name, keepScroll){
  if(!TABS.includes(name)) name = 'news';
  if(name === 'hotbar' && !visOn()) name = 'news';   /* 핫바는 비밀 모드에서만 */
  state.tab = name;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === name));
  document.querySelectorAll('.view').forEach(v => { v.hidden = v.dataset.view !== name; });
  if(location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
  if(!keepScroll) window.scrollTo({top:0});
  if(name === 'upper') renderUpper();
  if(name === 'calendar') renderCalendar();
  if(name === 'radar') renderRadar();
  if(name === 'hotbar') renderHotbar();
}

/* ---------------- 뉴스 ---------------- */
function leadBadge(leaders){
  const names = (leaders||[]).filter(Boolean).slice(0,2);
  if(!names.length) return '';
  return `<span class="lead"><b>🏢</b>${names.map(esc).join(' · ')}</span>`;
}

function flashHtml(a){
  const fresh = a.fresh !== false;
  const cls = !fresh ? 'fb old' : (a.breaking ? 'fb' : 'fb live');
  const label = !fresh ? '🕘 최신' : (a.breaking ? '⚡ 속보' : '⚡ 실시간');
  return `<a class="fcard" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">
    <div class="frow"><span class="${cls}">${label}</span><span class="ft">${esc(a.title)}</span></div>
    <div class="fmeta">${leadBadge(a.leaders)}
      <span class="src">${hm(a.time)||relTime(a.time)} <span class="p">· ${esc(a.press||'')}</span></span>
    </div>
  </a>`;
}

function issueHtml(a, i){
  const color = themeColor(a.theme);
  const rank = i + 1;   // 화면에 보이는 순서대로 번호를 매긴다(속보와 겹쳐 빠지는 카드가 있어도 번호가 끊기지 않게)
  const pressN = a.presses || 1;
  const pressBadge = pressN >= 2
    ? `<button class="presses" type="button" aria-label="다른 매체 기사 펼치기">${pressN}개 매체</button>`
    : (a.main_rank ? `<span class="presses" style="cursor:default">메인 ${a.main_rank}위</span>` : '');
  const brk = a.breaking ? '<span class="brk">속보</span>' : '';
  const open = state.open.has(a.id);
  const related = (a.related||[]);
  const relHtml = related.length
    ? `<div class="relm">` + related.map(r =>
        `<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)} <span class="rp">· ${esc(r.press||'')}</span></a>`).join('') + `</div>`
    : '';
  const det = (a.summary || relHtml)
    ? `<div class="idet">${a.summary ? `<div class="isum">${esc(a.summary)}</div>` : ''}${relHtml}</div>` : '';
  return `<article class="icard${open?' open':''}" style="--c:${color}" data-id="${esc(a.id)}">
    <div class="irow">
      <span class="rankb${rank<=3?' top3':''}">${rank}</span>
      <a class="ititle" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a>
    </div>
    <div class="ifoot">${brk}${leadBadge(a.leaders)}${pressBadge}
      <span class="src" style="margin-left:auto">${hm(a.time)||relTime(a.time)} · ${esc(a.press||'')}</span>
      ${det ? `<button class="exp" type="button" aria-label="요약과 다른 매체 기사 펼치기">${open?'▴':'▾'}</button>` : ''}
    </div>
    ${det}
  </article>`;
}

let lastKey = '';
let lastFlashHtml = '';
let lastIssueHtml = '';
function renderNews(force){
  if(!state.data) return;
  const key = [state.data.generated_at, state.more?1:0].join('|');
  if(!force && key === lastKey) return;
  lastKey = key;

  const fl = flashList();
  const iss = issueList();

  const fh = fl.length
    ? fl.map(flashHtml).join('')
    : `<div class="mini-empty">수집된 속보가 없습니다.</div>`;
  if(fh !== lastFlashHtml){
    lastFlashHtml = fh;
    $('#flashList').innerHTML = fh;
  }

  const shown = state.more ? iss : iss.slice(0, FIRST_ISSUES);
  const ih = shown.length
    ? shown.map(issueHtml).join('')
    : `<div class="mini-empty">수집된 이슈가 없습니다.</div>`;
  if(ih !== lastIssueHtml){
    lastIssueHtml = ih;
    $('#issueList').innerHTML = ih;
  }
  const more = $('#moreIssues');
  more.hidden = iss.length <= FIRST_ISSUES;
  more.textContent = state.more ? '이슈 접기' : '이슈 더 보기';
}

/* ---------------- 호재·혼조·악재 전광판 (🇰🇷 · 🇺🇸) -------------
   오늘 모은 속보·이슈를 한국 관련 / 미국 관련으로 나누고,
   각각의 제목·요약 단어 점수로 시장 분위기를 한 칸으로 요약한다.
   (나중에 news.json 에 코스피·코스닥 / 나스닥·다우 등 등락률 필드가 생기면 그 값을 먼저 본다) */
const MOOD_GOOD = ['급등','상승','반등','호실적','사상최대','수주','타결','강세','돌파','상한가','최고치','흑자','회복','기대감','신기록'];
const MOOD_BAD = ['급락','하락','폭락','약세','충격','악재','금리인상','전쟁','우려','반토막','하한가','적자','유출','속락','불안','경고'];
const MOOD_MID = ['혼조','눈치보기','보합','엇갈','관망','혼재'];
/* 미국 쪽 기사로 보는 표지 — 미국 정규장이 닫힌 한국 낮에는 야간선물 기사가 미국 흐름을 대신한다 */
const US_TAG = /뉴욕|미\s*증시|미증시|나스닥|다우|S&P|연준|엔비디아|FOMC|월가|트럼프|나스닥\s*선물|S&P\s*선물|미\s*선물|미증시\s*선물|야간선물|선물/i;
/* 제목·요약에 코스피·코스닥이 있으면 회사 이름이 미국꺼라도 한국장 재료로 본다 */
const KR_TAG = /코스피|코스닥|유가증권|한국거래소/;

/* 기사 한 건은 각 칸에 한 번만 센다 — 한 기사에서 '상승'을 다섯 번 써도 한 표 */
function moodScore(texts){
  let g = 0, b = 0, n = 0;
  for(const t of texts){
    if(MOOD_GOOD.some(w => t.includes(w))) g++;
    if(MOOD_BAD.some(w => t.includes(w))) b++;
    if(MOOD_MID.some(w => t.includes(w))) n++;
  }
  return { g, b, n, count: texts.length };
}

function moodJudge(s){
  if(!s.count) return null;
  const why = `호재 ${s.g} · 악재 ${s.b} · 혼조 ${s.n} (기사 ${s.count}건)`;
  if(s.n >= Math.max(s.g, s.b)) return { key:'mid', label:'혼조', why };
  const diff = s.g - s.b;
  if(diff >= 2) return { key:'good', label:'호재', why };
  if(diff <= -2) return { key:'bad', label:'악재', why };
  return { key:'mid', label:'혼조', why };
}

/* 지수 등락률 필드가 들어오면 이쪽을 먼저 쓴다 (없으면 null) */
function moodFromIndex(vals){
  const nums = vals.filter(v => v != null && v !== '' && !isNaN(Number(v))).map(Number);
  if(!nums.length) return null;
  const avg = nums.reduce((a, b) => a + b, 0) / nums.length;
  const why = `지수 평균 ${avg.toFixed(2)}% (${nums.length}개) — 등락률 직접 반입`;
  if(avg >= 0.5) return { key:'good', label:'호재', why };
  if(avg <= -0.5) return { key:'bad', label:'악재', why };
  return { key:'mid', label:'혼조', why };
}

/* 헤더 전광판: { kr, us } — 한국·미국 따로 */
function marketMoods(){
  const d = state.data || {};
  const idx = d.index || d.indices || {};
  const arts = flashAll().concat(issueAll()).slice(0, 30);
  const krTexts = [], usTexts = [];
  for(const a of arts){
    const raw = (a.title || '') + ' ' + (a.summary || '');
    const to = (KR_TAG.test(raw) || !US_TAG.test(raw)) ? krTexts : usTexts;
    to.push(raw.toLowerCase());
  }
  const kr = moodFromIndex([idx.kospi_chg, idx.kosdaq_chg]) || moodJudge(moodScore(krTexts));
  const us = moodFromIndex([idx.nasdaq_chg, idx.dow_chg, idx.sp500_chg]) || moodJudge(moodScore(usTexts));
  return { kr, us };
}

function paintMood(sel, m, flag, name){

  el.title = `${name} 시장 분위기 — ${m.why}`;
  el.setAttribute('aria-label', `${name} 시장 분위기 ${m.label}`);
}

function renderMood(){

  paintMood('#moodKr', kr, '🇰🇷', '한국');

}

/* ---------------- 다가오는 일정 (data/schedule.json) ----------------
   날짜가 지난 일정은 화면에서 자동으로 빠지고, 테마·종목 이름에 걸리는 일정만 배지로 붙는다. */
let schedData = null;
async function ensureSched(){
  if(schedData) return schedData;
  try{
    const res = await fetch('data/schedule.json?_=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    schedData = await res.json();
    try{ localStorage.setItem('newsradar_sched', JSON.stringify(schedData)); }catch(e){}
  }catch(err){
    try{ schedData = JSON.parse(localStorage.getItem('newsradar_sched') || 'null'); }catch(e){}
  }
  return schedData;
}
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
/* 오늘 이후 일정만, 날짜 순으로 */
function schedUpcoming(s){
  const t = todayStr();
  return (((s || schedData) || {}).events || []).filter(e => (e.date || '') >= t)
    .sort((a, b) => (a.date || '').localeCompare(b.date || ''));
}
/* 이벤트 key가 넘긴 글자들(테마명·키워드·종목 테마)에 걸리는지 */
function schedHit(e, texts){
  const keys = (e.keys || []).map(k => String(k).toLowerCase());
  return keys.some(k => (texts || []).some(x => String(x || '').toLowerCase().includes(k)));
}
function schedFor(texts, limit){
  return schedUpcoming().filter(e => schedHit(e, texts)).slice(0, limit || 2);
}

let radarRendered = '';

/* 레이더 등 켜기·정렬 — 미리 뽑아 둔 테마(radar.json)에 오늘 모은 뉴스가 몇 건 붙었는지
   세어서, 뉴스가 많이 붙은 테마를 위로 올리고 불을 켜다. */
function radarNewsTexts(){
  const news = flashAll().concat(issueAll()).map(a =>
    [a.title, a.summary, (a.leaders || []).join(' ')].filter(Boolean).join(' ').toLowerCase()
  );
  const up = (upperData() && upperData().items) || [];
  const ups = up.map(it =>
    [it.name, it.theme, it.issue_summary, it.article_title].filter(Boolean).join(' ').toLowerCase()
  );
  return news.concat(ups).filter(Boolean);
}

function radarRows(r){
  const tiers = ((r && r.tiers) || []).filter(t => t.active !== false);
  const texts = tiers.length ? radarNewsTexts() : [];
  const rows = tiers.map(t => {
    const kws = (t.keywords || []).map(k => String(k).toLowerCase()).filter(k => k.length > 1);
    let matched = 0;
    if(kws.length && texts.length){
      for(const txt of texts) if(kws.some(k => txt.includes(k))) matched++;
    }
    return { tier: t, matched };
  });
  /* 뉴스가 많이 붙은 테마가 위로, 붙은 뉴스가 없는 순차는 원래 순차대로 아래에 대기 */
  rows.sort((a, b) => (b.matched - a.matched) || ((a.tier.rank || 0) - (b.tier.rank || 0)));
  return rows;
}

function updateRadarDot(){
  const r = state.radar;
  const rows = radarRows(r);
  const activeN = rows.length;
  const matchedRows = rows.filter(x => x.matched > 0);
  const hitN = matchedRows.length;
  const newsN = matchedRows.reduce((s, x) => s + x.matched, 0);
  const cls = hitN ? 'rdot hot' : 'rdot';
  const tip = !activeN ? '레이더 대기 중'
    : (hitN ? `${hitN}개 테마에 뉴스 ${newsN}건이 붙어 있음` : '아직 뉴스가 붙은 테마 없음');
  document.querySelectorAll('#radarDot, #radarDotBig').forEach(el => {
    el.className = cls + (el.id === 'radarDotBig' ? ' big' : '');
    el.title = tip;
  });
  const tab = document.querySelector('.tab.radar');
  if(tab) tab.setAttribute('aria-label', '레이더 — ' + tip);
  return rows;
}

    bar.hidden = !head.length;
    bar.innerHTML = head.length ? `<b>📅 일정</b>${head.join('<span>·</span>')}` : '';
  }
  const rows = updateRadarDot();
  if($('#radarSub')) $('#radarSub').textContent = (r && r.base_date_text) ? r.base_date_text : '';
  if($('#radarNote')) $('#radarNote').textContent = (r && r.drop_note) ? r.drop_note : '종목 옆 숫자 = 고점 대비 하락 % (예: 67 → -67%)';
  if(!rows.length){
    box.innerHTML = `<div class="empty">레이더 자료를 불러오지 못했습니다.<br>잠시 후 다시 열어 주세요.</div>`;
    return;
  }
  const html = rows.map(x => radarTierHtml(x.tier, x.matched,
    schedFor([x.tier.theme].concat(x.tier.keywords || []), 2))).join('');
  if(!force && html === radarRendered) return;
  radarRendered = html;
  box.innerHTML = html;
}

    return;
  }
  const sec = (d.sections || []).find(x => x.key === hotbarSec) || d.sections[0];
  hotbarSec = sec.key;
  if($('#hotSub')) $('#hotSub').textContent = (d.base_date_text || '') + (d.universe ? ` · ${d.universe}종목` : '');
  document.querySelectorAll('#hotSeg button').forEach(b => b.classList.toggle('on', b.dataset.sec === sec.key));
  box.innerHTML = (sec.stages || []).map(hotStageHtml).join('');
}

/* ---------------- 데이터 ---------------- */
/* 새로고침 결과를 잠깐 띄우는 토스트 (1.8초 뒤 자동으로 사라진다) */
let toastTimer = null;
function toast(msg){
  const el = $('#toast');
  if(!el){ return; }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.classList.remove('show');
    // 사라지는 동안은 글자를 남기고, 다 사라진 뒤에는 비운다(덮개 없이 떠 있는 글자처럼 읽히지 않게)
    setTimeout(() => { if(!el.classList.contains('show')) el.textContent = ''; }, 220);
  }, 1800);
}
/* 데이터가 만들어진 시각을 HH:MM 으로 */
function dataHm(data){
  const m = /(\d{1,2}):(\d{2})/.exec((data && data.generated_at_kst) || '');
  if(m) return m[1].padStart(2,'0') + ':' + m[2];
  return hm(data && data.generated_at);
}

let loading = 0;   // 진행 중인 요청 수 — 자동 갱신과 수동 새로고침이 겹쳐도 회전이 끊기지 않게
async function load(manual){
  const btn = $('#btnRefresh');
  if(manual){
    loading++;
    btn.classList.add('spinning');
    btn.setAttribute('aria-busy', 'true');
  }
  const prevGen = state.data && state.data.generated_at;
  try{
    const res = await fetch('data/news.json?_=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    if(res.headers.get('x-news-cache') === '1') throw new Error('offline: saved copy');
    const data = await res.json();
    state.data = data;
    try{ localStorage.setItem('newsradar_last', JSON.stringify(data)); }catch(e){}
    applyData(data);
    $('#liveTxt').textContent = 'LIVE';
    if(manual){
      const t = dataHm(data);
      const prevT = prevGen ? new Date(prevGen).getTime() : NaN;
      const nextT = data.generated_at ? new Date(data.generated_at).getTime() : NaN;
      const changed = !isNaN(nextT) && (isNaN(prevT) || nextT > prevT);
      toast(changed
        ? `✅ 최신 뉴스 반영됨${t ? ' (' + t + ')' : ''}`
        : `ℹ️ 현재 최신 상태${t ? ' (' + t + ' 기준)' : ''}`);
    }
  }catch(err){
    let cached = null;
    try{ cached = JSON.parse(localStorage.getItem('newsradar_last')||'null'); }catch(e){}
    if(cached && !state.data){ state.data = cached; applyData(cached); $('#liveTxt').textContent = '저장본'; }
    else if(!state.data){
      $('#flashList').innerHTML = `<div class="empty">뉴스를 불러오지 못했습니다.<br>잠시 후 새로고침(⟳)을 눌러 주세요.</div>`;
      $('#issueList').innerHTML = '';
    }
    if(manual) toast('⚠️ 새로고침 실패 — 잠시 후 다시 시도');
  }finally{
    if(manual){
      loading--;
      if(loading <= 0){ loading = 0; btn.classList.remove('spinning'); btn.removeAttribute('aria-busy'); }
      /* 비밀 방문자 수를 켜 둔 경우에는 숫자도 함께 새로 받는다 */
      visDone = false;
      if(!visBadge.hidden) visNumber();
    }
  }
}

function applyData(data){
  const age = relTime(data.generated_at);
  $('#updated').textContent = (data.generated_at_kst || '–') + (age ? ` (${age})` : '');
  renderNews(false);
  renderMood();
  if(state.tab === 'upper') renderUpper();
  if(state.tab === 'calendar') renderCalendar();
  if(state.tab === 'radar') renderRadar();
  updateRadarDot();
}

$('#moreIssues').addEventListener('click', () => { state.more = !state.more; renderNews(true); });
/* 카드 펼치기: 요약 전체 + 같은 이슈의 다른 매체 기사 */
$('#issueList').addEventListener('click', e => {
  const card = e.target.closest('.icard');
  if(!card) return;
  const btn = e.target.closest('.exp, .presses');
  if(!btn) return;
  if(btn.tagName === 'A') return;
  e.preventDefault();
  const id = card.dataset.id;
  const open = !card.classList.contains('open');
  card.classList.toggle('open', open);
  if(open) state.open.add(id); else state.open.delete(id);
  const ex = card.querySelector('.exp');
  if(ex) ex.textContent = open ? '▴' : '▾';
});
$('#btnRefresh').addEventListener('click', () => load(true));
/* 상한가 카드: 요약 전문 + 기사 제목 펼치기 */
$('#upperList').addEventListener('click', e => {
  const btn = e.target.closest('.up-more');
  if(!btn) return;
  const card = btn.closest('.up-card');
  if(!card) return;
  const open = card.classList.toggle('open');
  btn.textContent = open ? '접기 ▴' : '더 보기 ▾';
});
/* 테마달력: 달 선택 · 테마 아코디언 */
$('#monGrid').addEventListener('click', e => {
  const b = e.target.closest('.mon');
  if(!b) return;
  state.month = b.dataset.month;
  renderCalendar();
});
$('#calThemes').addEventListener('click', e => {
  const h = e.target.closest('.th-head');
  if(!h) return;
  const card = h.closest('.th-card');
  if(card) card.classList.toggle('open');
});
$('#calAll').addEventListener('click', () => {
  const cards = document.querySelectorAll('#calThemes .th-card');
  if(!cards.length) return;
  const allOpen = [...cards].every(c => c.classList.contains('open'));
  cards.forEach(c => c.classList.toggle('open', !allOpen));
  $('#calAll').textContent = allOpen ? '모두 펼치기' : '모두 접기';
});
document.querySelectorAll('.tab').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
/* 핫바: 일봉·주봉·월봉 전환 / 단계별 더 보기 */
$('#hotSeg').addEventListener('click', e => {
  const b = e.target.closest('button[data-sec]');
  if(!b) return;
  hotbarSec = b.dataset.sec;
  state.hotOpen.clear();
  renderHotbar();
});
$('#hotBody').addEventListener('click', e => {
  const b = e.target.closest('.hb-more');
  if(!b) return;
  const s = Number(b.dataset.stage);
  if(state.hotOpen.has(s)) state.hotOpen.delete(s); else state.hotOpen.add(s);
  renderHotbar();
  const again = document.querySelector(`#hotBody .hb-more[data-stage="${s}"]`);
  if(again) again.scrollIntoView({block:'nearest'});
});
addEventListener('hashchange', () => {
  let name = (location.hash||'').replace('#','');
  if(TABS.includes(name) && name !== state.tab) switchTab(name, true);
});

/* 자동 새로고침: 5분마다, 화면이 보일 때만 (바뀐 내용이 없으면 화면을 다시 그리지 않는다) */
setInterval(() => { if(document.visibilityState === 'visible') load(false); }, 5*60*1000);
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && state.data){
    const age = Date.now() - new Date(state.data.generated_at).getTime();
    if(age > 5*60*1000) load(false);
  }
});

/* 맨 위로 */
const topBtn = $('#top');
addEventListener('scroll', () => topBtn.classList.toggle('show', scrollY > 600), {passive:true});
topBtn.onclick = () => scrollTo({top:0, behavior:'smooth'});

/* ---------------- 비밀 방문자 수 (관리자 전용) ----------------
   켜기: 상단 LIVE 배지를 1.5초 안에 3번 연속 탭  또는  주소 끝에 ?me=5696
   끄기: 같은 방법으로 다시 3번 탭. 상태는 localStorage(nr_show_visitors)에 남는다. */
const VIS_KEY = 'nr_show_visitors', VIS_ID = '5696';
const visBadge = $('#visitors');
let visDone = false;

function visOn(){
  try{ return localStorage.getItem(VIS_KEY) === '1'; }catch(e){ return false; }
}
function visSave(on){
  try{ on ? localStorage.setItem(VIS_KEY,'1') : localStorage.removeItem(VIS_KEY); }catch(e){}
}
/* 화면을 건드리지 않고, 켜져 있을 때만 조용히 숫자만 채운다 */
async function visNumber(){
  if(visDone || !visBadge || visBadge.hidden) return;
  try{
    const res = await fetch('https://crawler5696.goatcounter.com/counter/TOTAL.json?_=' + Date.now(), {cache:'no-store'});
    if(!res.ok) return;
    const j = await res.json();
    const v = (j && (j.count_unique != null ? j.count_unique : j.count));
    if(v === undefined || v === null || v === '') return;
    const n = Number(v);
    $('#visitorN').textContent = isNaN(n) ? String(v) : n.toLocaleString('ko-KR');
    visDone = true;
  }catch(e){}
}
function visPaint(){
  if(!visBadge) return;
  visBadge.hidden = !visOn();
  if(!visBadge.hidden) visNumber();
  hotPaint();
}
/* 핫바도 같은 비밀 인증을 따른다 — 켜져 있을 때만 탭이 나타나고, 끄면 탭째로 사라진다 */
function hotPaint(){
  const on = visOn();
  const tab = document.querySelector('.tab.hot');
  if(tab) tab.hidden = !on;
  const bar = document.querySelector('.tabs');
  if(bar) bar.classList.toggle('five', on);
  if(!on && state.tab === 'hotbar') switchTab('news');
}
function visToggle(){
  visSave(!visOn());
  visPaint();
}
/* 주소에 ?me=5696 이 있으면 자동으로 켜 둔다 */
try{
  const m = /[?&]me=([^&#]*)/.exec(location.search || '');
  if(m && decodeURIComponent(m[1]) === VIS_ID){ visSave(true); }
}catch(e){}
visPaint();
/* LIVE 배지 1.5초 안 3연속 탭 → 토글 */
(function(){
  const live = $('#live');
  if(!live) return;
  let taps = [];
  live.addEventListener('click', () => {
    const now = Date.now();
    taps = taps.filter(t => now - t < 1500);
    taps.push(now);
    if(taps.length >= 3){ taps = []; visToggle(); }
  });
})();

/* PWA */
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }

/* 시작 탭 (주소 끝에 #radar 처럼 붙이면 그 탭으로 열린다) */
let startTab = (location.hash||'').replace('#','');
switchTab(TABS.includes(startTab) ? startTab : 'news', true);
load(false);
/* 레이더 등은 뉴스와 별개로 먼저 받아 두고, 뉴스가 갱신될 때마다 다시 켜짐을 살펴본다 */
ensureRadar().then(() => updateRadarDot());
</script>
<script data-goatcounter="https://crawler5696.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
