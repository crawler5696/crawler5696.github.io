<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>증시 뉴스 레이더 · 실시간 주식 뉴스 태그</title>
<meta name="description" content="국내 증시 관련 뉴스를 30분마다 자동 수집해 테마 태그와 2줄 요약으로 보여주는 실시간 뉴스 대시보드">
<meta name="theme-color" content="#0b1120">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="뉴스레이더">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#0b1120; --bg2:#0e1730; --card:#141d33; --card2:#18233d;
    --line:rgba(255,255,255,.08); --txt:#eef2fa; --dim:#8f9bb3; --dim2:#6b778f;
    --accent:#4f8cff; --up:#ff5a6e; --ok:#3ddc97;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 50% -200px, rgba(79,140,255,.22), transparent 70%),
      linear-gradient(180deg,var(--bg) 0%, var(--bg2) 100%);
    background-attachment:fixed;
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Roboto,sans-serif;
    font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom: calc(28px + env(safe-area-inset-bottom));
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:680px;margin:0 auto;padding:0 14px}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:20;
    backdrop-filter:saturate(160%) blur(14px);
    -webkit-backdrop-filter:saturate(160%) blur(14px);
    background:linear-gradient(180deg, rgba(11,17,32,.94), rgba(11,17,32,.78));
    border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);
  }
  .top{display:flex;align-items:center;gap:10px;padding:12px 0 8px}
  .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#4f8cff,#8b5cf6);
    display:grid;place-items:center;font-size:16px;box-shadow:0 4px 14px rgba(79,140,255,.4);flex:none}
  .brand{font-size:17px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
  .brand small{display:block;font-size:11px;font-weight:500;color:var(--dim2);letter-spacing:0}
  .spacer{flex:1}
  .live{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ok);
    background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.25);
    padding:4px 8px;border-radius:20px;white-space:nowrap}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(61,220,151,.5)}50%{opacity:.5;box-shadow:0 0 0 5px rgba(61,220,151,0)}}
  .refresh{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--card);
    color:var(--dim);display:grid;place-items:center;font-size:15px;flex:none;cursor:pointer;transition:.2s}
  .refresh:active{transform:scale(.92);background:var(--card2)}
  .refresh.spinning{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim2);padding-bottom:9px}
  .meta b{color:var(--dim);font-weight:600}

  .search{position:relative;padding-bottom:10px}
  .search input{
    width:100%;border:1px solid var(--line);background:var(--card);color:var(--txt);
    border-radius:12px;padding:11px 12px 11px 36px;font-size:14px;outline:none;font-family:inherit;
    transition:.2s;
  }
  .search input:focus{border-color:rgba(79,140,255,.55);background:var(--card2)}
  .search .ic{position:absolute;left:12px;top:calc(50% - 6px);color:var(--dim2);font-size:14px}

  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 11px;scrollbar-width:none;-ms-overflow-style:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--dim);
    border-radius:20px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;
    white-space:nowrap;transition:.15s;font-family:inherit;display:flex;align-items:center;gap:5px;
  }
  .chip .n{font-size:11px;color:var(--dim2);font-weight:700}
  .chip[aria-pressed="true"]{color:#fff;border-color:transparent;background:linear-gradient(135deg,#4f8cff,#7c5cff);
    box-shadow:0 4px 14px rgba(79,140,255,.35)}
  .chip[aria-pressed="true"] .n{color:rgba(255,255,255,.8)}

  /* ---------- list ---------- */
  main{padding-top:12px}
  .daymark{font-size:12px;font-weight:700;color:var(--dim2);margin:14px 2px 8px;letter-spacing:.2px}
  .card{
    display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 14px 12px;margin-bottom:9px;position:relative;overflow:hidden;
    transition:.15s;animation:fade .35s ease both;
  }
  .card:active{transform:scale(.992);background:var(--card2)}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,#4f8cff);opacity:.85}
  .row1{display:flex;align-items:center;gap:6px;margin-bottom:7px;flex-wrap:wrap}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;letter-spacing:-.1px;
    background:rgba(255,255,255,.06);color:var(--c);border:1px solid rgba(255,255,255,.14)}
  .tag{font-size:11px;color:var(--dim2);background:rgba(255,255,255,.04);border:1px solid var(--line);
    padding:2px 7px;border-radius:6px}
  .hot{font-size:10.5px;font-weight:800;color:#ffd166;background:rgba(255,209,102,.12);
    border:1px solid rgba(255,209,102,.3);padding:2px 7px;border-radius:6px;margin-left:auto}
  .title{font-size:15.5px;font-weight:700;line-height:1.38;letter-spacing:-.3px;margin:0 0 6px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .sum{font-size:13.5px;color:#a9b4c9;line-height:1.55;margin:0 0 9px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .foot{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim2)}
  .press{font-weight:600;color:var(--dim)}
  .sep{width:2px;height:2px;border-radius:50%;background:var(--dim2)}
  .go{margin-left:auto;font-size:11px;color:#5f6f8c}

  .empty{text-align:center;color:var(--dim2);padding:60px 20px;font-size:13.5px;line-height:1.7}
  .skeleton{height:88px;border-radius:var(--radius);background:linear-gradient(90deg,#141d33,#1b2743,#141d33);
    background-size:200% 100%;animation:sk 1.4s infinite;margin-bottom:9px}
  @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

  footer{margin-top:22px;padding:16px 4px 8px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--dim2);line-height:1.7;text-align:center}
  footer b{color:var(--dim)}
  #top{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));width:42px;height:42px;
    border-radius:50%;border:1px solid var(--line);background:rgba(20,29,51,.9);color:var(--dim);
    display:none;place-items:center;font-size:16px;backdrop-filter:blur(8px);cursor:pointer;z-index:15}
  #top.show{display:grid}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="logo">📈</div>
      <div class="brand">증시 뉴스 레이더<small>테마 태그 · 2줄 요약</small></div>
      <div class="spacer"></div>
      <div class="live" id="live"><span class="dot"></span><span id="liveTxt">LIVE</span></div>
      <button class="refresh" id="btnRefresh" aria-label="새로고침">⟳</button>
    </div>
    <div class="meta">
      <span>업데이트 <b id="updated">불러오는 중…</b></span>
      <span class="sep"></span>
      <span id="total">–</span>
    </div>
    <div class="search">
      <span class="ic">🔍</span>
      <input id="q" type="search" inputmode="search" placeholder="종목·키워드 검색 (예: 반도체, 상한가)" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main class="wrap" id="list">
  <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
</main>

<footer>
  <b>네이버뉴스</b> 경제 섹션을 30분마다 자동 수집합니다.<br>
  요약은 기사 도입부를 줄인 것으로, 투자 판단의 근거가 아닙니다.<br>
  저작권은 각 언론사에 있으며 모든 기사는 원문 링크로 연결됩니다.
</footer>
<button id="top" aria-label="맨 위로">↑</button>

<script>
const state = { data:null, theme:'all', q:'', rendered:0 };
const BATCH = 30;

const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function relTime(iso){
  if(!iso) return '';
  const d = new Date(iso), now = new Date();
  const m = Math.floor((now - d)/60000);
  if(isNaN(m)) return '';
  if(m < 1) return '방금';
  if(m < 60) return m + '분 전';
  const h = Math.floor(m/60);
  if(h < 24) return h + '시간 전';
  const days = Math.floor(h/24);
  if(days < 7) return days + '일 전';
  return (d.getMonth()+1) + '.' + d.getDate();
}
function dayKey(iso){
  if(!iso) return '날짜 미상';
  const d = new Date(iso);
  const t = new Date(); const y = new Date(t.getTime()-864e5);
  const same = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  if(same(d,t)) return '오늘';
  if(same(d,y)) return '어제';
  return (d.getMonth()+1) + '월 ' + d.getDate() + '일';
}

function themes(){ return (state.data && state.data.themes) || []; }
function allArticles(){ return (state.data && state.data.articles) || []; }

function renderChips(){
  const total = allArticles().length;
  let html = `<button class="chip" data-theme="all" aria-pressed="${state.theme==='all'}">전체 <span class="n">${total}</span></button>`;
  for(const t of themes()){
    html += `<button class="chip" data-theme="${esc(t.id)}" aria-pressed="${state.theme===t.id}"
      style="${state.theme===t.id?'':`color:${t.color}`}">${esc(t.label)} <span class="n">${t.count}</span></button>`;
  }
  $('#chips').innerHTML = html;
  $('#chips').querySelectorAll('.chip').forEach(b => b.onclick = () => {
    state.theme = b.dataset.theme; state.rendered = 0; renderChips(); renderList(); window.scrollTo({top:0,behavior:'smooth'});
  });
}

function filtered(){
  const q = state.q.trim().toLowerCase();
  return allArticles().filter(a => {
    if(state.theme !== 'all' && a.theme !== state.theme) return false;
    if(!q) return true;
    const hay = (a.title + ' ' + (a.summary||'') + ' ' + (a.tags||[]).join(' ') + ' ' + (a.press||'')).toLowerCase();
    return hay.includes(q);
  });
}

function cardHtml(a){
  const color = a.color || themeColor(a.theme);
  const tags = (a.tags||[]).slice(0,3).map(t => `<span class="tag">${esc(t)}</span>`).join('');
  const hot = (a.relevance||0) >= 14 ? '<span class="hot">화제</span>' : '';
  return `<a class="card" style="--c:${color}" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">
    <div class="row1"><span class="badge" style="--c:${color};background:${color}22;border-color:${color}55">${esc(a.theme_label||'기타')}</span>${tags}${hot}</div>
    <h2 class="title">${esc(a.title)}</h2>
    ${a.summary ? `<p class="sum">${esc(a.summary)}</p>` : ''}
    <div class="foot"><span class="press">${esc(a.press||'')}</span><span class="sep"></span><span>${relTime(a.time)}</span><span class="go">원문 →</span></div>
  </a>`;
}

function themeColor(id){
  const t = themes().find(x => x.id === id);
  return (t && t.color) || '#8f9bb3';
}

function renderList(reset){
  const items = filtered();
  const list = $('#list');
  if(reset) { list.innerHTML = ''; state.rendered = 0; }
  if(!items.length){
    list.innerHTML = `<div class="empty">조건에 맞는 기사가 없습니다.<br>검색어나 테마를 바꿔 보세요.</div>`;
    return;
  }
  const start = state.rendered;
  const slice = items.slice(start, start + BATCH);
  let html = '';
  let lastDay = start > 0 ? dayKey(items[start-1].time) : null;
  for(const a of slice){
    const dk = dayKey(a.time);
    if(dk !== lastDay){ html += `<div class="daymark">${esc(dk)}</div>`; lastDay = dk; }
    html += cardHtml(a);
  }
  if(start === 0) list.innerHTML = html;
  else list.insertAdjacentHTML('beforeend', html);
  state.rendered = start + slice.length;
  if(state.rendered < items.length){
    list.insertAdjacentHTML('beforeend', `<div id="more" style="text-align:center;padding:14px;color:#6b778f;font-size:12.5px">불러오는 중…</div>`);
  }
  watchSentinel();
}

/* 무한 스크롤 */
let loading = false;
const sentinelObserver = new IntersectionObserver(entries => {
  if(entries.some(e => e.isIntersecting) && !loading){
    const more = $('#more');
    if(!more) return;
    loading = true; more.remove();
    renderList(false); loading = false;
  }
}, {rootMargin:'500px'});
function watchSentinel(){
  sentinelObserver.disconnect();
  const more = $('#more');
  if(more) sentinelObserver.observe(more);
}

async function load(manual){
  const btn = $('#btnRefresh');
  if(manual){ btn.classList.add('spinning'); }
  try{
    const res = await fetch('data/news.json?_=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    state.data = data;
    try{ localStorage.setItem('newsradar_last', JSON.stringify(data)); }catch(e){}
    applyData(data);
    $('#liveTxt').textContent = 'LIVE';
  }catch(err){
    let cached = null;
    try{ cached = JSON.parse(localStorage.getItem('newsradar_last')||'null'); }catch(e){}
    if(cached){ applyData(cached); $('#liveTxt').textContent = '저장본'; }
    else {
      $('#list').innerHTML = `<div class="empty">뉴스를 불러오지 못했습니다.<br>잠시 후 새로고침(⟳)을 눌러 주세요.</div>`;
    }
  }finally{
    btn.classList.remove('spinning');
  }
}

function applyData(data){
  $('#updated').textContent = data.generated_at_kst || '–';
  $('#total').textContent = '기사 ' + (data.count||0) + '건';
  if(state.theme !== 'all' && !(data.themes||[]).some(t => t.id === state.theme)) state.theme = 'all';
  renderChips();
  renderList(true);
}

$('#q').addEventListener('input', e => { state.q = e.target.value; state.rendered = 0; renderList(true); });
$('#btnRefresh').addEventListener('click', () => load(true));

/* 자동 새로고침: 5분마다, 화면이 보일 때만 */
setInterval(() => { if(document.visibilityState === 'visible') load(false); }, 5*60*1000);
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && state.data){
    const age = Date.now() - new Date(state.data.generated_at).getTime();
    if(age > 5*60*1000) load(false);
  }
});

/* 맨 위로 */
const topBtn = $('#top');
addEventListener('scroll', () => topBtn.classList.toggle('show', scrollY > 700), {passive:true});
topBtn.onclick = () => scrollTo({top:0, behavior:'smooth'});

/* PWA */
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }

load(false);
</script>
</body>
</html>
